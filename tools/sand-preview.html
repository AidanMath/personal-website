<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image to Sand Preview Tool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #e8e8e8;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #fff;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
      padding: 20px;
      background: #252525;
      border-radius: 8px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-group label {
      font-size: 0.85rem;
      color: #aaa;
    }

    .control-group input[type="number"],
    .control-group input[type="text"],
    .control-group select {
      padding: 8px 12px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #333;
      color: #fff;
      font-size: 0.9rem;
      width: 120px;
    }

    .control-group input[type="file"] {
      padding: 8px;
      border: 1px dashed #555;
      border-radius: 4px;
      background: #2a2a2a;
      color: #fff;
      cursor: pointer;
    }

    .control-group input[type="color"] {
      width: 60px;
      height: 36px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .control-group input[type="checkbox"] {
      width: 20px;
      height: 20px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.primary {
      background: #4a9eff;
      color: #fff;
    }

    button.primary:hover {
      background: #3a8eef;
    }

    button.secondary {
      background: #444;
      color: #fff;
    }

    button.secondary:hover {
      background: #555;
    }

    .preview-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .preview-panel {
      background: #252525;
      border-radius: 8px;
      padding: 15px;
    }

    .preview-panel h3 {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .canvas-container {
      position: relative;
      background: #e8dcc8; /* Hokusai sky color */
      border-radius: 4px;
      overflow: hidden;
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .stats {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #888;
    }

    .export-area {
      margin-top: 20px;
      padding: 20px;
      background: #252525;
      border-radius: 8px;
    }

    .export-area textarea {
      width: 100%;
      height: 200px;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #1a1a1a;
      color: #4a9eff;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 0.8rem;
      resize: vertical;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    @media (max-width: 900px) {
      .preview-area {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Image to Pixel Sand Converter</h1>

    <div class="controls">
      <div class="control-group">
        <label>Image</label>
        <input type="file" id="imageInput" accept="image/*">
      </div>

      <div class="control-group">
        <label>Or Image URL</label>
        <input type="text" id="imageUrl" placeholder="https://..." style="width: 200px;">
      </div>

      <div class="control-group">
        <label>Pixel Size</label>
        <input type="number" id="pixelSize" value="4" min="1" max="20">
      </div>

      <div class="control-group">
        <label>Canvas Width</label>
        <input type="number" id="canvasWidth" value="600" min="100" max="2000">
      </div>

      <div class="control-group">
        <label>Canvas Height</label>
        <input type="number" id="canvasHeight" value="400" min="100" max="2000">
      </div>

      <div class="control-group">
        <label>Skip Color</label>
        <div class="row">
          <input type="color" id="skipColor" value="#e8dcc8">
          <input type="checkbox" id="skipColorEnabled">
        </div>
      </div>

      <div class="control-group">
        <label>Color Tolerance</label>
        <input type="number" id="colorTolerance" value="40" min="0" max="255">
      </div>

      <div class="control-group" style="justify-content: flex-end;">
        <button class="primary" onclick="render()">Render</button>
      </div>
    </div>

    <div class="preview-area">
      <div class="preview-panel">
        <h3>Original Image</h3>
        <div class="canvas-container" id="originalContainer">
          <canvas id="originalCanvas"></canvas>
        </div>
        <div class="stats" id="originalStats">Load an image to begin</div>
      </div>

      <div class="preview-panel">
        <h3>Pixel Sand Preview</h3>
        <div class="canvas-container" id="sandContainer">
          <canvas id="sandCanvas"></canvas>
        </div>
        <div class="stats" id="sandStats">-</div>
      </div>
    </div>

    <div class="export-area">
      <h3 style="margin-bottom: 15px; color: #888; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Export Data</h3>
      <div class="row" style="margin-bottom: 10px;">
        <button class="secondary" onclick="exportTypeScript()">Export TypeScript</button>
        <button class="secondary" onclick="exportJSON()">Export JSON</button>
        <button class="secondary" onclick="copyToClipboard()">Copy to Clipboard</button>
      </div>
      <textarea id="exportOutput" readonly placeholder="Rendered data will appear here..."></textarea>
    </div>
  </div>

  <script>
    let loadedImage = null;
    let grainData = [];

    // Load image from file input
    document.getElementById('imageInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          loadImage(event.target.result);
        };
        reader.readAsDataURL(file);
      }
    });

    // Load image from URL
    document.getElementById('imageUrl').addEventListener('change', (e) => {
      const url = e.target.value.trim();
      if (url) {
        loadImage(url);
      }
    });

    function loadImage(src) {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        loadedImage = img;
        drawOriginal();
        render();
      };
      img.onerror = () => {
        alert('Failed to load image. If using a URL, make sure it allows cross-origin access.');
      };
      img.src = src;
    }

    function drawOriginal() {
      if (!loadedImage) return;

      const canvas = document.getElementById('originalCanvas');
      const ctx = canvas.getContext('2d');
      const canvasWidth = parseInt(document.getElementById('canvasWidth').value);
      const canvasHeight = parseInt(document.getElementById('canvasHeight').value);

      canvas.width = canvasWidth;
      canvas.height = canvasHeight;

      // Calculate aspect-ratio-preserving dimensions
      const imgAspect = loadedImage.width / loadedImage.height;
      const canvasAspect = canvasWidth / canvasHeight;

      let drawWidth, drawHeight, offsetX, offsetY;

      if (imgAspect > canvasAspect) {
        // Image is wider - fit to width
        drawWidth = canvasWidth;
        drawHeight = canvasWidth / imgAspect;
        offsetX = 0;
        offsetY = (canvasHeight - drawHeight) / 2;
      } else {
        // Image is taller - fit to height
        drawHeight = canvasHeight;
        drawWidth = canvasHeight * imgAspect;
        offsetX = (canvasWidth - drawWidth) / 2;
        offsetY = 0;
      }

      // Clear with background color
      const skipColor = document.getElementById('skipColor').value;
      ctx.fillStyle = skipColor;
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      // Draw image
      ctx.drawImage(loadedImage, offsetX, offsetY, drawWidth, drawHeight);

      document.getElementById('originalStats').textContent =
        `Original: ${loadedImage.width}x${loadedImage.height} | Display: ${canvasWidth}x${canvasHeight}`;
    }

    function render() {
      if (!loadedImage) return;

      const pixelSize = parseInt(document.getElementById('pixelSize').value);
      const canvasWidth = parseInt(document.getElementById('canvasWidth').value);
      const canvasHeight = parseInt(document.getElementById('canvasHeight').value);
      const skipColorEnabled = document.getElementById('skipColorEnabled').checked;
      const skipColorHex = document.getElementById('skipColor').value;
      const colorTolerance = parseInt(document.getElementById('colorTolerance').value);

      // Parse skip color
      const skipColor = hexToRgb(skipColorHex);

      // First, draw the original at the target size
      drawOriginal();

      // Get pixel data from the original canvas
      const originalCanvas = document.getElementById('originalCanvas');
      const originalCtx = originalCanvas.getContext('2d');
      const imageData = originalCtx.getImageData(0, 0, canvasWidth, canvasHeight);
      const pixels = imageData.data;

      // Calculate grid dimensions
      const cols = Math.floor(canvasWidth / pixelSize);
      const rows = Math.floor(canvasHeight / pixelSize);

      // Setup sand canvas
      const sandCanvas = document.getElementById('sandCanvas');
      const sandCtx = sandCanvas.getContext('2d');
      sandCanvas.width = canvasWidth;
      sandCanvas.height = canvasHeight;

      // Clear with background
      sandCtx.fillStyle = skipColorHex;
      sandCtx.fillRect(0, 0, canvasWidth, canvasHeight);

      // Extract grain data by sampling pixels
      grainData = [];
      let skippedCount = 0;

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          // Sample from center of each grid cell
          const sampleX = Math.floor(col * pixelSize + pixelSize / 2);
          const sampleY = Math.floor(row * pixelSize + pixelSize / 2);

          // Get pixel color
          const idx = (sampleY * canvasWidth + sampleX) * 4;
          const r = pixels[idx];
          const g = pixels[idx + 1];
          const b = pixels[idx + 2];
          const a = pixels[idx + 3];

          // Skip transparent or matching skip color
          if (a < 128) {
            skippedCount++;
            continue;
          }

          if (skipColorEnabled && colorsMatch(r, g, b, skipColor.r, skipColor.g, skipColor.b, colorTolerance)) {
            skippedCount++;
            continue;
          }

          // Store grain data
          grainData.push({
            x: col,
            y: row,
            color: [
              Math.round((r / 255) * 1000) / 1000,
              Math.round((g / 255) * 1000) / 1000,
              Math.round((b / 255) * 1000) / 1000,
              1.0
            ],
            rgb: { r, g, b }
          });

          // Draw the grain
          sandCtx.fillStyle = `rgb(${r},${g},${b})`;
          sandCtx.fillRect(col * pixelSize, row * pixelSize, pixelSize - 1, pixelSize - 1);
        }
      }

      document.getElementById('sandStats').textContent =
        `Grid: ${cols}x${rows} | Grains: ${grainData.length} | Skipped: ${skippedCount} | Pixel size: ${pixelSize}px`;
    }

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : { r: 0, g: 0, b: 0 };
    }

    function colorsMatch(r1, g1, b1, r2, g2, b2, tolerance) {
      return Math.abs(r1 - r2) <= tolerance &&
             Math.abs(g1 - g2) <= tolerance &&
             Math.abs(b1 - b2) <= tolerance;
    }

    function exportTypeScript() {
      if (grainData.length === 0) {
        alert('No grain data to export. Render an image first.');
        return;
      }

      const pixelSize = parseInt(document.getElementById('pixelSize').value);
      const canvasWidth = parseInt(document.getElementById('canvasWidth').value);
      const canvasHeight = parseInt(document.getElementById('canvasHeight').value);
      const cols = Math.floor(canvasWidth / pixelSize);
      const rows = Math.floor(canvasHeight / pixelSize);

      let output = `// Auto-generated sand grain data
// Grid: ${cols}x${rows}, Pixel size: ${pixelSize}, Canvas: ${canvasWidth}x${canvasHeight}
// Total grains: ${grainData.length}

import { RGBAColor } from './models/sand-grain.model';

export interface ImageGrainData {
  x: number;
  y: number;
  color: RGBAColor;
}

export const IMAGE_METADATA = {
  cols: ${cols},
  rows: ${rows},
  pixelSize: ${pixelSize},
  canvasWidth: ${canvasWidth},
  canvasHeight: ${canvasHeight},
};

export const IMAGE_GRAIN_DATA: ImageGrainData[] = [\n`;

      for (let i = 0; i < grainData.length; i++) {
        const g = grainData[i];
        output += `  {x:${g.x},y:${g.y},color:[${g.color.join(',')}]}`;
        if (i < grainData.length - 1) output += ',';
        output += '\n';
      }

      output += '];\n';

      document.getElementById('exportOutput').value = output;
    }

    function exportJSON() {
      if (grainData.length === 0) {
        alert('No grain data to export. Render an image first.');
        return;
      }

      const pixelSize = parseInt(document.getElementById('pixelSize').value);
      const canvasWidth = parseInt(document.getElementById('canvasWidth').value);
      const canvasHeight = parseInt(document.getElementById('canvasHeight').value);
      const cols = Math.floor(canvasWidth / pixelSize);
      const rows = Math.floor(canvasHeight / pixelSize);

      const exportData = {
        metadata: {
          cols,
          rows,
          pixelSize,
          canvasWidth,
          canvasHeight,
          grainCount: grainData.length
        },
        grains: grainData.map(g => ({
          x: g.x,
          y: g.y,
          color: g.color
        }))
      };

      document.getElementById('exportOutput').value = JSON.stringify(exportData, null, 2);
    }

    function copyToClipboard() {
      const textarea = document.getElementById('exportOutput');
      textarea.select();
      document.execCommand('copy');
      alert('Copied to clipboard!');
    }

    // Auto-render when settings change
    ['pixelSize', 'canvasWidth', 'canvasHeight', 'skipColorEnabled', 'skipColor', 'colorTolerance'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => {
        if (loadedImage) render();
      });
    });

    // Load the Great Wave by default
    window.onload = () => {
      // Load the image from the same directory
      loadImage('great_wave.jpg');
    };
  </script>
</body>
</html>
