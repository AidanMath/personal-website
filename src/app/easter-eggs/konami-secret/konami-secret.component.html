<div class="konami-overlay" (click)="onClose()">
  <div class="konami-modal" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="onClose()">
      <i class="fas fa-times"></i>
    </button>

    <div class="konami-content">
      <div class="konami-header">
        <div class="konami-code">
          <span>&#x2191;</span>
          <span>&#x2191;</span>
          <span>&#x2193;</span>
          <span>&#x2193;</span>
          <span>&#x2190;</span>
          <span>&#x2192;</span>
          <span>&#x2190;</span>
          <span>&#x2192;</span>
          <span>B</span>
          <span>A</span>
        </div>
        <h2>Secret Unlocked!</h2>
      </div>

      <div class="secrets-grid">
        @for (secret of secrets; track $index) {
          <div class="secret-item" [style.animation-delay]="$index * 0.1 + 's'">
            <i [class]="secret.icon"></i>
            <p>{{ secret.text }}</p>
          </div>
        }
      </div>

      <div class="konami-footer">
        <p>The Konami Code has been around since 1986!</p>
        <button class="btn btn-primary" (click)="onClose()">
          <i class="fas fa-check"></i> Awesome!
        </button>
      </div>
    </div>
  </div>
</div>
