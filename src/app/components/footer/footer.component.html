<footer class="footer">
  <div class="footer-content container">
    <div class="footer-main">
      <div class="footer-brand">
        <a href="#" class="footer-logo" (click)="scrollToTop()">
          <span>Aidan</span>
        </a>
        <p>Building elegant solutions to complex problems.</p>
      </div>

      <div class="footer-links">
        <h4>Quick Links</h4>
        <ul>
          @for (link of quickLinks; track link.label) {
            <li>
              <a [href]="link.href" (click)="scrollToSection($event, link.href)">
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
      </div>

      <div class="footer-social">
        <h4>Connect</h4>
        <div class="social-icons">
          @for (social of socialLinks; track social.label) {
            <a [href]="social.url" target="_blank" rel="noopener noreferrer" [attr.aria-label]="social.label">
              <i [class]="social.icon"></i>
            </a>
          }
        </div>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; {{ currentYear }} Aidan. All rights reserved.</p>
      <button class="back-to-top" (click)="scrollToTop()" aria-label="Back to top">
        <i class="fas fa-arrow-up"></i>
      </button>
    </div>
  </div>

  <div class="footer-gradient"></div>
</footer>
