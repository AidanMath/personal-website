<section class="projects section" id="projects">
  <div class="container">
    <div class="glass-section">
      <h2 class="section-title">My <span>Projects</span></h2>

      <div class="projects-grid">
        @for (project of featuredProjects; track project.id) {
          <article class="project-card">
            <div class="project-image">
              @if (project.image) {
                <img [src]="project.image" [alt]="project.title">
              } @else {
                <div class="placeholder-image">
                  <i class="fas fa-code"></i>
                </div>
              }
              <div class="project-overlay">
                <div class="project-links">
                  @if (project.github) {
                    <a [href]="project.github" target="_blank" rel="noopener noreferrer" aria-label="View GitHub">
                      <i class="fab fa-github"></i>
                    </a>
                  }
                  @if (project.demo) {
                    <a [href]="project.demo" target="_blank" rel="noopener noreferrer" aria-label="View Demo">
                      <i class="fas fa-external-link-alt"></i>
                    </a>
                  }
                </div>
              </div>
            </div>

            <div class="project-content">
              <h3>{{ project.title }}</h3>
              <p>{{ project.description }}</p>
              <div class="project-tags">
                @for (tag of project.tags; track tag) {
                  <span class="tag">{{ tag }}</span>
                }
              </div>
            </div>
          </article>
        }
      </div>

      <div class="projects-cta">
        <a href="https://github.com/AidanMath" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
          <i class="fab fa-github"></i> View More on GitHub
        </a>
      </div>
    </div>
  </div>
</section>
