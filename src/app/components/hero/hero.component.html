<section class="hero" id="hero">
  <div class="hero-background">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="grid-pattern"></div>
  </div>

  <div class="hero-content">
    <p class="hero-greeting">Hello, I'm</p>
    <h1 class="hero-name">Aidan</h1>
    <div class="hero-tagline">
      <span class="typed-text">{{ currentTagline }}</span>
      <span class="cursor">|</span>
    </div>
    <p class="hero-description">
      Building elegant solutions to complex problems. Passionate about clean code,
      strategic thinking, and continuous learning.
    </p>
    <div class="hero-buttons">
      <a class="btn btn-primary" (click)="scrollToSection('#projects')">
        <i class="fas fa-code"></i> View Projects
      </a>
      <a class="btn btn-secondary" (click)="scrollToSection('#contact')">
        <i class="fas fa-envelope"></i> Contact Me
      </a>
    </div>
  </div>

  <div class="scroll-indicator" (click)="scrollToSection('#about')">
    <span>Scroll Down</span>
    <i class="fas fa-chevron-down"></i>
  </div>
</section>
